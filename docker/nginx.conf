server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Harmless to keep even though the MVP doesn't terminate WebSockets itself (realtime is
        # triggered into the existing beyondcode/laravel-websockets server -- see
        # docs/WORKFLOW.md section 9 in the sibling sabonglara repo); kept here in case a direct
        # WS endpoint is ever added to this app.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
