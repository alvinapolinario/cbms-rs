services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabonglara-rs-app
    ports:
      # Deliberately a different host port than the Laravel app's own ${APP_PORT:-80}, so both
      # can run side by side for diffing responses (see docs/WORKFLOW.md's verification approach
      # in the sibling sabonglara repo).
      - "${APP_PORT:-8081}:80"
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-sabong_root}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@mysql:3306/${DB_DATABASE:-sabong_lara_db}"
      HOST: 0.0.0.0
      PORT: 8080
      MATCHING_BRIDGE_ENABLED: "${MATCHING_BRIDGE_ENABLED:-false}"
      MATCHING_BRIDGE_URL: "${MATCHING_BRIDGE_URL:-}"
      MATCHING_TO_BETTING_KEY: "${MATCHING_TO_BETTING_KEY:-}"
      BETTING_TO_MATCHING_KEY: "${BETTING_TO_MATCHING_KEY:-}"
      BET_MIN: "${BET_MIN:-1}"
      BET_MAX: "${BET_MAX:-1000000}"
      CASH_MAX: "${CASH_MAX:-1000000}"
      API_TOKEN_HOURS: "${API_TOKEN_HOURS:-18}"
      REQUIRE_CLOSED_BEFORE_RESULT: "${REQUIRE_CLOSED_BEFORE_RESULT:-true}"
      RECEIPT_RANDOM_DIGITS: "${RECEIPT_RANDOM_DIGITS:-6}"
      PUSHER_HOST: "${PUSHER_HOST:-127.0.0.1}"
      PUSHER_PORT: "${PUSHER_PORT:-6001}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-local}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-local}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-local}"
    networks:
      - sabonglara_default
    restart: unless-stopped

networks:
  sabonglara_default:
    # The sibling ../sabonglara repo's own `docker compose up` already creates this network
    # (its default project network -- project name "sabonglara" from that directory's name).
    # This app joins it rather than declaring its own, so it can reach the existing
    # `sabonglara-mysql` container by name without any host port forwarding.
    external: true
