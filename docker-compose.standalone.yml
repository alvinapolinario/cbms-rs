# Own database and app. Does not join or change the containers already on the host.
services:
  mysql:
    image: mariadb:11.4
    container_name: cbms-rs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-sabong_lara_db}
      MYSQL_USER: ${DB_USERNAME:-sabong_root}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
    ports:
      - "${DB_PORT:-3310}:3306"
    volumes:
      - cbms-rs-mysql-data:/var/lib/mysql
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - cbms

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbms-rs-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      DATABASE_URL: "mysql://${DB_USERNAME:-sabong_root}:${DB_PASSWORD}@mysql:3306/${DB_DATABASE:-sabong_lara_db}"
      HOST: 0.0.0.0
      PORT: "8080"
      WEB_ROOT: /srv/web
      BACKUP_DIR: /var/backups/cbms
      MATCHING_BRIDGE_ENABLED: "${MATCHING_BRIDGE_ENABLED:-false}"
      MATCHING_BRIDGE_URL: "${MATCHING_BRIDGE_URL:-}"
      MATCHING_TO_BETTING_KEY: "${MATCHING_TO_BETTING_KEY:-}"
      BETTING_TO_MATCHING_KEY: "${BETTING_TO_MATCHING_KEY:-}"
      BET_MIN: "${BET_MIN:-1}"
      BET_MAX: "${BET_MAX:-1000000}"
      CASH_MAX: "${CASH_MAX:-1000000}"
      API_TOKEN_HOURS: "${API_TOKEN_HOURS:-18}"
      REQUIRE_CLOSED_BEFORE_RESULT: "${REQUIRE_CLOSED_BEFORE_RESULT:-true}"
      RECEIPT_RANDOM_DIGITS: "${RECEIPT_RANDOM_DIGITS:-7}"
      PRINT_SERVICE_KEY: "${PRINT_SERVICE_KEY:-}"
      PUSHER_HOST: "${PUSHER_HOST:-host.docker.internal}"
      PUSHER_PORT: "${PUSHER_PORT:-6001}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-local}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-local}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-local}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cbms-rs-backups:/var/backups/cbms
    networks:
      - cbms

volumes:
  cbms-rs-mysql-data:
  cbms-rs-backups:

networks:
  cbms:
